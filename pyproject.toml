[project]
name = "ai-commerce-copy-agent"
version = "0.1.0"
description = "Shopify AI product copy agent: GraphQL sync, OpenAI copy generation, Stripe billing, Celery workers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.1.3,<4.2",
  "email-validator>=2.2.0",
  "requests>=2.32.0",
  "tenacity>=8.5.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "openai>=2.0.0",
  "stripe>=10.0.0",
  "cryptography>=43.0.0",
  "bleach>=6.1.0",
  "orjson>=3.10.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
